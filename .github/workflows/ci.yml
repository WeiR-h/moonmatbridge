name: scientific-interop
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MOONMAT_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install independent scientific readers
        run: python -m pip install -r requirements-dev.txt
      - name: Verify three MoonBit targets and both command line hosts
        run: npm run verify
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-interop-${{ github.sha }}
          path: verification/reports/
          if-no-files-found: error
